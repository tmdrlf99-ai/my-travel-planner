<!doctype html>
<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Travel Planner Admin</title><link rel="stylesheet" href="admin-style.css"/></head>
<body>
<section id="loginView" class="login-view"><div class="login-card"><div class="admin-mark">✦</div><strong>TRAVEL NOTE</strong><span>ADMIN</span><h1>관리자 로그인</h1><input id="email" type="email" placeholder="이메일"/><input id="password" type="password" placeholder="비밀번호"/><button id="loginBtn">로그인</button><p id="loginMsg"></p></div></section>
<div id="adminApp" hidden>
<aside class="admin-side"><div class="admin-brand"><div class="admin-mark">✦</div><strong>TRAVEL NOTE</strong></div><nav><button class="active" data-target="dashboard">대시보드</button><button data-target="trips">여행 관리</button><button data-target="events">일정 관리</button><button data-target="budget">예산 관리</button><button data-target="world">세계 지도</button></nav><div class="admin-bottom"><a href="index.html">← 공개페이지</a><button id="logoutBtn">로그아웃</button></div></aside>
<main class="admin-main">
<header><div><span>MY TRAVEL PLANNER</span><h1>관리자</h1></div><b>LIVE</b></header>
<section id="dashboard" class="admin-section active"><div class="section-head"><h2>대시보드</h2><p>등록된 여행과 일정, 예산 현황입니다.</p></div><div id="summaryGrid" class="summary-grid"></div></section>
<section id="trips" class="admin-section"><div class="section-head"><h2>여행 관리</h2><p>여행을 등록·수정·삭제합니다.</p></div><div class="split"><form id="tripForm" class="card"><input id="tripId" type="hidden"/><div class="two"><div><label>구분</label><select id="tripType"><option>국내</option><option>해외</option></select></div><div><label>상태</label><select id="tripStatus"><option>예정</option><option>완료</option><option>버킷리스트</option></select></div></div><label>여행명</label><input id="tripTitle" required/><div class="two"><div><label>시작일</label><input id="tripStart" type="date"/></div><div><label>종료일</label><input id="tripEnd" type="date"/></div></div><div class="two"><div><label>국내 지역</label><input id="tripRegion" placeholder="예: 제주"/></div><div><label>도시</label><input id="tripCity"/></div></div><label>국가</label><input id="tripCountry"/><label>메모</label><textarea id="tripMemo"></textarea><label class="check"><input id="tripVisible" type="checkbox" checked/> 공개</label><div class="actions"><button class="primary">저장</button><button type="button" id="tripReset">초기화</button></div></form><div class="card"><h3>등록 여행</h3><input id="tripSearch" class="search" placeholder="여행 검색"/><div id="tripList" class="list"></div></div></div></section>
<section id="events" class="admin-section"><div class="section-head"><h2>일정 관리</h2><p>날짜별 세부 일정을 관리합니다.</p></div><div class="split"><form id="eventForm" class="card"><input id="eventId" type="hidden"/><label>여행</label><select id="eventTrip"></select><div class="two"><div><label>일자</label><input id="eventDate" type="date" required/></div><div><label>구분</label><input id="eventCategory" value="일정"/></div></div><label>제목</label><input id="eventTitle" required/><label>설명</label><textarea id="eventDesc"></textarea><label class="check"><input id="eventVisible" type="checkbox" checked/> 공개</label><div class="actions"><button class="primary">저장</button><button type="button" id="eventReset">초기화</button></div></form><div class="card"><h3>등록 일정</h3><div id="eventList" class="list"></div></div></div></section>
<section id="budget" class="admin-section"><div class="section-head"><h2>예산 관리</h2><p>여행별 예산과 실제 지출을 관리합니다.</p></div><div class="split"><form id="budgetForm" class="card"><input id="budgetId" type="hidden"/><label>여행</label><select id="budgetTrip"></select><label>항목</label><select id="budgetCategory"><option>교통</option><option>숙박</option><option>식비</option><option>관광·쇼핑</option><option>기타</option></select><div class="two"><div><label>예산</label><input id="budgetAmount" type="number"/></div><div><label>실제 지출</label><input id="spentAmount" type="number"/></div></div><label>정렬순서</label><input id="budgetSort" type="number" value="100"/><div class="actions"><button class="primary">저장</button><button type="button" id="budgetReset">초기화</button></div></form><div class="card"><h3>등록 예산</h3><div id="budgetListAdmin" class="list"></div></div></div></section>
<section id="world" class="admin-section"><div class="section-head"><h2>세계 지도</h2><p>국가 마커와 방문 상태를 관리합니다.</p></div><div class="split"><form id="worldForm" class="card"><input id="worldId" type="hidden"/><label>국가명</label><input id="worldCountryAdmin" required/><div class="two"><div><label>X 위치(%)</label><input id="worldX" type="number" min="0" max="100"/></div><div><label>Y 위치(%)</label><input id="worldY" type="number" min="0" max="100"/></div></div><label>상태</label><select id="worldStatus"><option>방문</option><option>버킷리스트</option></select><label class="check"><input id="worldVisible" type="checkbox" checked/> 공개</label><div class="actions"><button class="primary">저장</button><button type="button" id="worldReset">초기화</button></div></form><div class="card"><h3>등록 국가</h3><div id="worldListAdmin" class="list"></div></div></div></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script>
</body></html>
